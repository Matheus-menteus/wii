<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>WiiMote Gamepad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            margin: 0;
            overflow: hidden;
            touch-action: none; /* Bloqueia zoom e scroll */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        #btn-iniciar {
            padding: 20px 40px; font-size: 24px; border-radius: 15px;
            background-color: #e74c3c; color: white; border: none; z-index: 10;
        }
        #gamepad {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: space-around;
            align-items: center;
        }
        /* D-PAD (Esquerda) */
        .dpad-container {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 5px;
        }
        .dpad-btn {
            background-color: #34495e; border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: #bdc3c7; user-select: none;
            box-shadow: 0 4px rgba(0,0,0,0.3);
        }
        .dpad-btn:active, .ativa { background-color: #7f8c8d; transform: translateY(2px); box-shadow: 0 2px rgba(0,0,0,0.3); }
        #up { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #down { grid-column: 2; grid-row: 3; }
        
        /* BOTÕES (Direita) */
        .botoes-container {
            display: flex; gap: 20px; transform: rotate(-15deg);
        }
        .btn-wii {
            width: 80px; height: 80px; border-radius: 50%;
            font-size: 30px; font-weight: bold; border: none; color: white;
            box-shadow: 0 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        #btn-b { background-color: #e67e22; margin-top: 40px; }
        #btn-a { background-color: #3498db; }
        .btn-wii.pressionado { box-shadow: 0 2px rgba(0,0,0,0.3); transform: translateY(4px); }
        
        #status { position: absolute; top: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <button id="btn-iniciar">Ativar Controle</button>
    <div id="status">Aguardando...</div>
    
    <div id="gamepad">
        <div class="dpad-container">
            <div class="dpad-btn" id="up">▲</div>
            <div class="dpad-btn" id="left">◀</div>
            <div class="dpad-btn" id="right">▶</div>
            <div class="dpad-btn" id="down">▼</div>
        </div>

        <div class="botoes-container">
            <div class="btn-wii" id="btn-b">B</div>
            <div class="btn-wii" id="btn-a">A</div>
        </div>
    </div>

    <script>
        // ⚠️ ATUALIZE SEU LINK AQUI
        const wsUrl = "wss://SEU-LINK-NOVO-8765.app.github.dev"; 
        
        let socket;
        let estado = {
            beta: 0, gamma: 0,
            btnA: false, btnB: false,
            up: false, down: false, left: false, right: false
        };

        document.getElementById('btn-iniciar').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                const permissao = await DeviceOrientationEvent.requestPermission();
                if (permissao === 'granted') iniciarConexao();
            } else {
                iniciarConexao();
            }
        });

        function iniciarConexao() {
            document.getElementById('btn-iniciar').style.display = 'none';
            document.getElementById('gamepad').style.display = 'flex';
            
            // Pede para o celular ficar em tela cheia e deitado (opcional)
            if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

            socket = new WebSocket(wsUrl);
            socket.onopen = () => document.getElementById('status').innerText = "🟢 Conectado!";
            
            window.addEventListener('deviceorientation', (e) => {
                estado.beta = Math.round(e.beta);
                estado.gamma = Math.round(e.gamma);
                enviarDados();
            });

            // Função para mapear toques nos botões
            function mapearBotao(id, chave) {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); estado[chave] = true; el.classList.add('ativa'); enviarDados(); });
                el.addEventListener('touchend', (e) => { e.preventDefault(); estado[chave] = false; el.classList.remove('ativa'); enviarDados(); });
            }

            mapearBotao('btn-a', 'btnA'); mapearBotao('btn-b', 'btnB');
            mapearBotao('up', 'up'); mapearBotao('down', 'down');
            mapearBotao('left', 'left'); mapearBotao('right', 'right');
        }

        function enviarDados() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(estado));
            }
        }
    </script>
</body>
</html>
