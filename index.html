<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WiiMote Celular</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita que a tela role enquanto você joga */
        }
        #btn-iniciar {
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            box-shadow: 0 6px #c0392b;
            cursor: pointer;
            margin-bottom: 30px;
        }
        #btn-iniciar:active {
            box-shadow: 0 2px #c0392b;
            transform: translateY(4px);
        }
        .sensor-data {
            font-size: 28px;
            margin: 15px;
            font-weight: bold;
            font-family: monospace;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>

    <button id="btn-iniciar">Ativar Controle</button>
    
    <div class="sensor-data" id="beta-display">Beta (Y): 0</div>
    <div class="sensor-data" id="gamma-display">Gamma (X): 0</div>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const displayBeta = document.getElementById('beta-display');
        const displayGamma = document.getElementById('gamma-display');

        btnIniciar.addEventListener('click', async () => {
            // Verifica se o navegador exige pedido formal de permissão (ex: iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissao = await DeviceOrientationEvent.requestPermission();
                    if (permissao === 'granted') {
                        iniciarSensores();
                    } else {
                        alert("Permissão negada! O controle não vai funcionar.");
                    }
                } catch (erro) {
                    console.error("Erro ao pedir permissão:", erro);
                }
            } else {
                // Navegadores que não exigem permissão prévia (maioria dos Androids)
                iniciarSensores();
            }
        });

        function iniciarSensores() {
            // Esconde o botão após a ativação
            btnIniciar.style.display = 'none';

            window.addEventListener('deviceorientation', (evento) => {
                // Arredondamos os valores para não lidar com casas decimais desnecessárias no jogo
                const beta = Math.round(evento.beta);   // Inclinação para frente e para trás
                const gamma = Math.round(evento.gamma); // Inclinação para a esquerda e direita

                // Atualiza a tela do celular
                displayBeta.innerText = `Beta (Y): ${beta}`;
                displayGamma.innerText = `Gamma (X): ${gamma}`;
            });
        }
    </script>
</body>
</html>
