<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>WiiMote Perfeito</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; margin: 0; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; }
        #btn-iniciar { padding: 20px 40px; font-size: 24px; border-radius: 15px; background-color: #e74c3c; color: white; border: none; z-index: 10; }
        #gamepad { display: none; width: 100%; height: 100%; justify-content: space-around; align-items: center; }
        #joystick-base { width: 150px; height: 150px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #joystick-knob { width: 60px; height: 60px; background: #7f8c8d; border-radius: 50%; position: absolute; top: 45px; left: 45px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); pointer-events: none; }
        .botoes-container { display: flex; gap: 20px; transform: rotate(-15deg); }
        .btn-wii { width: 80px; height: 80px; border-radius: 50%; font-size: 30px; font-weight: bold; border: none; color: white; box-shadow: 0 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; user-select: none; }
        #btn-b { background-color: #e67e22; margin-top: 40px; }
        #btn-a { background-color: #3498db; }
        .btn-wii.pressionado { box-shadow: 0 2px rgba(0,0,0,0.3); transform: translateY(4px); }
        #status { position: absolute; top: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <button id="btn-iniciar">Ativar Controle</button>
    <div id="status">Aguardando...</div>
    
    <div id="gamepad">
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        <div class="botoes-container">
            <div class="btn-wii" id="btn-b">B</div>
            <div class="btn-wii" id="btn-a">A</div>
        </div>
    </div>

    <script>
        // ⚠️ ATUALIZE SEU LINK AQUI
        const wsUrl = "wss://obscure-goldfish-wr6pwq94rrj92g4wj-8765.app.github.dev"; 
        
        let socket;
        let estado = { beta: 0, gamma: 0, btnA: false, btnB: false, joyX: 0, joyY: 0, shake: false };

        document.getElementById('btn-iniciar').addEventListener('click', async () => {
            // Pedir permissão de Giroscópio
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
            }
            // Pedir permissão de Acelerômetro
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch(e){}
            }
            iniciarConexao();
        });

        function iniciarConexao() {
            document.getElementById('btn-iniciar').style.display = 'none';
            document.getElementById('gamepad').style.display = 'flex';
            if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

            socket = new WebSocket(wsUrl);
            socket.onopen = () => document.getElementById('status').innerText = "🟢 Conectado!";
            
            window.addEventListener('deviceorientation', (e) => {
                estado.beta = Math.round(e.beta);
                estado.gamma = Math.round(e.gamma);
                enviarDados();
            });

            // ====== O NOVO DETECTOR DE FORÇA G (Linear) ======
            let lastX = 0, lastY = 0, lastZ = 0;
            window.addEventListener('devicemotion', (e) => {
                let acc = e.accelerationIncludingGravity;
                if (!acc) return;
                
                let deltaX = Math.abs(acc.x - lastX);
                let deltaY = Math.abs(acc.y - lastY);
                let deltaZ = Math.abs(acc.z - lastZ);
                
                // Limiar de 25 garante que foi uma tacada e não só um tremorzinho
                if (deltaX + deltaY + deltaZ > 25) { 
                    if (!estado.shake) { estado.shake = true; enviarDados(); }
                } else {
                    if (estado.shake) { estado.shake = false; enviarDados(); }
                }
                lastX = acc.x; lastY = acc.y; lastZ = acc.z;
            });

            // Analógico
            const base = document.getElementById('joystick-base');
            const knob = document.getElementById('joystick-knob');
            const raioMaximo = 45;

            function moverJoystick(e) {
                e.preventDefault();
                let touch = e.targetTouches[0];
                let rect = base.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                let distancia = Math.sqrt(dx * dx + dy * dy);

                if (distancia > raioMaximo) {
                    dx = (dx / distancia) * raioMaximo;
                    dy = (dy / distancia) * raioMaximo;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                estado.joyX = dx / raioMaximo;
                estado.joyY = dy / raioMaximo;
                enviarDados();
            }

            function soltarJoystick(e) {
                e.preventDefault();
                knob.style.transform = `translate(0px, 0px)`;
                estado.joyX = 0; estado.joyY = 0;
                enviarDados();
            }

            base.addEventListener('touchstart', moverJoystick, {passive: false});
            base.addEventListener('touchmove', moverJoystick, {passive: false});
            base.addEventListener('touchend', soltarJoystick);

            // Botões
            function mapearBotao(id, chave) {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); estado[chave] = true; el.classList.add('pressionado'); enviarDados(); });
                el.addEventListener('touchend', (e) => { e.preventDefault(); estado[chave] = false; el.classList.remove('pressionado'); enviarDados(); });
            }
            mapearBotao('btn-a', 'btnA'); mapearBotao('btn-b', 'btnB');
        }

        function enviarDados() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(estado));
            }
        }
    </script>
</body>
</html>
